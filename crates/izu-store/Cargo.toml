[package]
name = "izu-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
izu-model.workspace = true
izu-platform = { path = "../izu-platform", version = "0.1.0" }
sha2.workspace = true
