[package]
name = "izu-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
izu-model.workspace = true
izu-engine.workspace = true
izu-platform = { path = "../izu-platform", version = "0.1.0" }
izu-process = { path = "../izu-process", version = "0.1.0" }
serde.workspace = true
thiserror.workspace = true
sha1 = "0.10"
sha2.workspace = true
getrandom.workspace = true
tempfile.workspace = true
rustix = { version = "1.1.5", features = ["fs", "process"] }
base64 = "0.22"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1.48", features = ["rt", "time", "macros"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
